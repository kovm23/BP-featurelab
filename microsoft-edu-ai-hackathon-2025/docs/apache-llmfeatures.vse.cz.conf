<VirtualHost *:80>
    ServerName llmfeatures.vse.cz

    DocumentRoot /var/www/llmfeatures/current
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 1200

    ErrorLog ${APACHE_LOG_DIR}/llmfeatures-error.log
    CustomLog ${APACHE_LOG_DIR}/llmfeatures-access.log combined

    # --- Security headers (requires: sudo a2enmod headers) ---
    # These are cloned into the HTTPS vhost by `certbot --apache`. Verify they
    # remain present in the :443 vhost after Certbot runs.
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        # HSTS is honoured by browsers only over HTTPS; harmless on plain HTTP.
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        # Optional Content-Security-Policy. Test with the Report-Only variant
        # first, then switch to enforcing once the SPA loads without violations:
        # Header always set Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    </IfModule>

    # Browser vola stejny origin /api/* a Apache request preposle na interni backend.
    ProxyPass /api/ http://llm.vse.cz:5000/
    ProxyPassReverse /api/ http://llm.vse.cz:5000/

    <Directory /var/www/llmfeatures/current>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        DirectoryIndex index.html

        RewriteEngine On
        RewriteBase /

        RewriteRule ^api/ - [L]

        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
