# SPA + reverse proxy /api/* -> backend:5000
# Mirrors the production Apache VirtualHost (ProxyPass /api/, ProxyTimeout 1200).
server {
    listen 80;
    server_name _;

    # Flask MAX_CONTENT_LENGTH is 2 GB — allow the same through the proxy
    client_max_body_size 2g;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Docker's embedded DNS + variable upstream: re-resolves the backend
        # container after recreation (a fixed proxy_pass caches the IP at
        # nginx startup and 502s once the backend gets a new address).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
